<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <!-- Fuente elegante -->

    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    

    <!-- Header -->
    <header>
        <div class="circulo">
            <img src="logo.png" alt="Belleza">
        </div>
        <nav>
            <ul>
                <li><a href="#">Inicio</a></li>
                <li><a href="#">Servicios</a></li>

                                       C 135,210 165,170 105,120

                <a href="#" class="btn-hero">Reservar cita</a>

        </div>
        <div class="imagen-hero">
                <img src="Mujer.png" alt="Modelo de belleza">
            </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
